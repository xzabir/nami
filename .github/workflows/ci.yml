name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install system dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y ffmpeg

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Smoke test (import + config validation)
      env:
        FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
        PYTHONPATH: ${{ github.workspace }}
      run: |
        python -c "
        from engine.utils.config import CONFIG
        from engine.core.pipeline import get_placeholder_captions
        from engine.prompting.caption_validator import validate_and_overwrite
        styles = ['formal', 'sarcastic', 'humorous_tech', 'humorous_non_tech']
        placeholders = get_placeholder_captions(styles)
        assert len(placeholders) == 4, 'Placeholder generation failed'
        assert CONFIG['clip_budget_seconds'] > 0, 'Config loading failed'
        print('All smoke tests passed.')
        "

  docker-build-and-push:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
    - uses: actions/checkout@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: docker/Dockerfile
        push: true
        tags: |
          xzabir/nami:latest
          xzabir/nami:${{ github.sha }}
