name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"



    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Smoke test (import + config validation)
      env:
        FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
        PYTHONPATH: ${{ github.workspace }}
      run: |
        python -c "
        from app.config import settings
        from app.services.style_prompts import STYLE_ORDER
        assert len(STYLE_ORDER) == 4, 'Style prompts failed'
        assert settings.min_video_seconds > 0, 'Config loading failed'
        print('All smoke tests passed.')
        "

  docker-build-and-push:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
    - uses: actions/checkout@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile.submission
        push: true
        tags: |
          xzabir/nami:latest
          xzabir/nami:${{ github.sha }}
