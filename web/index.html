<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nami.</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>
    <div id="intro-splash" class="intro-splash">
        <h1 class="brand splash-text">nami.</h1>
    </div>

    <div id="video-overlay" class="video-overlay">
        <video id="bg-video" autoplay loop muted playsinline crossorigin="anonymous"></video>
        <div class="video-dimmer"></div>
    </div>

    <main class="app-container" id="app-container">
        <div class="hero-section" id="hero-section">
            <h1 class="brand">nami.</h1>
            <p class="subtitle">video captioning powered by AMD.</p>

            <form id="nami-form" class="nami-form">
                <input type="url" id="video-url" placeholder="enter video url..." required autocomplete="off"
                    spellcheck="false">
                <div class="loader-line" id="loader-line"></div>
            </form>
        </div>

        <div class="results-view" id="results-view">
            <div class="results-header">
                <h2 class="brand-small">nami.</h2>
                <button id="reset-btn" class="reset-btn">New Video</button>
            </div>

            <div class="captions-grid" id="captions-grid">
                <!-- Captions injected dynamically -->
            </div>
        </div>
    </main>

    <script src="/static/script.js"></script>
</body>

</html>
